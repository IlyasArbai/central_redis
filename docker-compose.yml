services:
  redis:
    image: redis:7-alpine
    container_name: central-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_ADMIN_PASSWORD}
      --appendonly yes
      --aclfile /data/users.acl
    volumes:
      - redis_data:/data
    networks:
      redis-network:
        aliases:
          - central-redis
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'redis-cli -a "$${REDIS_ADMIN_PASSWORD}" ping 2>/dev/null | grep -q PONG',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      REDIS_ADMIN_PASSWORD: ${REDIS_ADMIN_PASSWORD}
    security_opt:
      - no-new-privileges:true

volumes:
  redis_data:
    name: central_redis_data

networks:
  redis-network:
    external: true
